<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Empresa</title>
    <style>
        body {
            background: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            margin: 0;
            padding: 2rem;
        }
        h1 {
            color: black;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2em;
        }
        form {
            width: 400px;
            margin: 0 auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #555;
            text-align: left;
        }
        input, select, textarea {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: black;
            outline: none;
            background-color: #f0f8ff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #003366;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #00509e;
        }
    </style>

    <script>
        function cadastrar(){
        event.preventDefault();

        
        var nomeEmpresa = document.getElementById('nomeEmpresa').value;
        var email = document.getElementById('email').value;
        var telefone = document.getElementById('telefone').value;
        var cnpj = document.getElementById('cnpj').value;
        var site = document.getElementById('site').value;
        var tipoEmpresa = document.getElementById('tipoEmpresa').value;
        var descricao = document.getElementById('descricao').value;

        
        if (nomeEmpresa === '' || email === '' || telefone === '' || cnpj === '' || tipoEmpresa === '') {
            alert('Por favor, preencha todos os campos obrigatórios!');
            return;
        }

        else{
            alert(
                "Dados da Empresa Cadastrados:\n\n" +
                "Nome: " + nomeEmpresa + "\n" +
                "E-mail: " + email + "\n" +
                "Telefone: " + telefone + "\n" +
                "CNPJ: " + cnpj + "\n" +
                "Site: " + site + "\n" +
                "Nicho de Mercado: " + tipoEmpresa + "\n" +
                "Descrição: " + descricao
            );}
            
        }
    </script>
</head>
<body>
    <h1>Cadastro de Empresa</h1>
    <form>
        <label for="nomeEmpresa">🏢 Nome da Empresa:</label>
        <input type="text" name="nomeEmpresa" id="nomeEmpresa" maxlength="100" required>
    
        <label for="email">📧 E-mail da Empresa:</label>
        <input type="email" name="email" id="email" placeholder="exemplo@empresa.com" required>
    
        <label for="telefone">📞 Telefone:</label>
        <input type="tel" name="telefone" id="telefone" placeholder="(XX) XXXXX-XXXX" required>
    
        <label for="cnpj">🆔 CNPJ:</label>
        <input type="text" name="cnpj" id="cnpj" placeholder="XX.XXX.XXX/0001-XX" required>
    
        <label for="site">🌐 Site da Empresa:</label>
        <input type="url" name="site" id="site" placeholder="https://www.empresa.com">
    
        <label for="tipoEmpresa">🏷️ Nicho de Mercado:</label>
        <select name="tipoEmpresa" id="tipoEmpresa" required>
            <option value="">Selecione</option>
            <option value="TECNOLOGIA">Tecnologia</option>
            <option value="VENDAS">Vendas</option>
            <option value="MARKETING">Marketing</option>
            <option value="NEGÓCIOS">Negócios</option>
        </select>
    
        <label for="descricao">📝 Descrição da Empresa:</label>
        <textarea name="descricao" id="descricao" rows="4" placeholder="Fale um pouco sobre a empresa..."></textarea>
    
        <button onclick="cadastrar()">✅ Cadastrar Empresa</button>
    </form>
    
</body>
</html>
